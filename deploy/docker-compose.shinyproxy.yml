services:
  shinyproxy:
    image: docker.io/openanalytics/shinyproxy:3.2.4@sha256:0c2fa688f4622401a8433f2e496f5c156b595de9fd1c95c8c98c0523d1060c96
    container_name: cgv-shinyproxy
    restart: unless-stopped
    user: "0:0"
    env_file:
      - .env
      - path: .env.local
        required: false
    networks:
      - sp-net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./deploy/shinyproxy/application.yml:/opt/shinyproxy/application.yml:ro
      - ./.env:/opt/shinyproxy/env/cgv.env:ro
    ports:
      - "127.0.0.1:${SHINYPROXY_PORT:-8080}:8080"
    environment:
      CGV_IMAGE: "${CGV_IMAGE:-cgv:1.1.0}"
      SP_ANNOTATIONS_DIR: "${SP_ANNOTATIONS_DIR:?set-SP_ANNOTATIONS_DIR-to-an-absolute-host-path}"
      SP_GENOMES_DIR: "${SP_GENOMES_DIR:?set-SP_GENOMES_DIR-to-an-absolute-host-path}"
      SP_GO_ANNOTATIONS_DIR: "${SP_GO_ANNOTATIONS_DIR:?set-SP_GO_ANNOTATIONS_DIR-to-an-absolute-host-path}"
      SP_DATA_DIR: "${SP_DATA_DIR:?set-SP_DATA_DIR-to-an-absolute-host-path}"
      SP_CACHE_DIR: "${SP_CACHE_DIR:?set-SP_CACHE_DIR-to-an-absolute-host-path}"
      SP_NCBI_DOWNLOADS_DIR: "${SP_NCBI_DOWNLOADS_DIR:?set-SP_NCBI_DOWNLOADS_DIR-to-an-absolute-host-path}"
      CGV_NCBI_CACHE_MAX_GB: "${CGV_NCBI_CACHE_MAX_GB:-50}"
      CGV_NCBI_USAGE_LOG_ENABLED: "${CGV_NCBI_USAGE_LOG_ENABLED:-true}"
      SP_CONTAINER_MEMORY: "${SP_CONTAINER_MEMORY:-2g}"
      SP_MAX_INSTANCES_PER_USER: "${SP_MAX_INSTANCES_PER_USER:-10}"
      SP_MAX_TOTAL_INSTANCES: "${SP_MAX_TOTAL_INSTANCES:-10}"
      SP_MAX_LIFETIME_MINUTES: "${SP_MAX_LIFETIME_MINUTES:-120}"
      SP_HEARTBEAT_RATE_MS: "${SP_HEARTBEAT_RATE_MS:-30000}"
      SP_APP_PERF_TIMING: "${SP_APP_PERF_TIMING:-0}"
      SP_PERF_RUN_LABEL: "${SP_PERF_RUN_LABEL:-manual}"
      SP_ORTHO_SUSPEND_HIDDEN: "${SP_ORTHO_SUSPEND_HIDDEN:-1}"
      SP_GENE_CATALOG_ENABLED: "${SP_GENE_CATALOG_ENABLED:-0}"
      SP_HOMO_DEFER_SEQUENCE: "${SP_HOMO_DEFER_SEQUENCE:-0}"
      SP_ORTHO_DEFER_SEQUENCE: "${SP_ORTHO_DEFER_SEQUENCE:-0}"
      SP_FOOTER_DEFER_SEQUENCE: "${SP_FOOTER_DEFER_SEQUENCE:-0}"
      SP_DEFER_FEATURE_GC: "${SP_DEFER_FEATURE_GC:-0}"
      SP_HOMO_RENDER_CHUNK_SIZE: "${SP_HOMO_RENDER_CHUNK_SIZE:-1}"
      SP_HOMO_AUTO_RENDER_DELAY_MS: "${SP_HOMO_AUTO_RENDER_DELAY_MS:-120}"
      SP_ORTHO_RENDER_CHUNK_SIZE: "${SP_ORTHO_RENDER_CHUNK_SIZE:-1}"
      SP_ORTHO_AUTO_RENDER_MORE: "${SP_ORTHO_AUTO_RENDER_MORE:-1}"
      SP_ORTHO_AUTO_RENDER_DELAY_MS: "${SP_ORTHO_AUTO_RENDER_DELAY_MS:-120}"
      SP_HOMO_INITIAL_VISIBLE: "${SP_HOMO_INITIAL_VISIBLE:-1}"
      SP_ORTHO_INITIAL_VISIBLE: "${SP_ORTHO_INITIAL_VISIBLE:-1}"
      SP_ISOFORM_RENDER_BATCH_SIZE: "${SP_ISOFORM_RENDER_BATCH_SIZE:-1}"
      SP_ISOFORM_RENDER_BATCH_DELAY_MS: "${SP_ISOFORM_RENDER_BATCH_DELAY_MS:-120}"
      SP_ORTHO_SERVER_RENDER_NUDGE: "${SP_ORTHO_SERVER_RENDER_NUDGE:-0}"
      SP_BACKGROUND_REPORTS_ENABLED: "${APP_BACKGROUND_REPORTS_ENABLED:-1}"
      SP_LASTZ_GLOBAL_WORKERS: "${APP_LASTZ_GLOBAL_WORKERS:-1}"
      SP_LASTZ_GLOBAL_QUEUE_WAIT_SECONDS: "${APP_LASTZ_GLOBAL_QUEUE_WAIT_SECONDS:-1800}"
    security_opt:
      - no-new-privileges:true

  nginx:
    image: docker.io/library/nginx:alpine
    container_name: cgv-nginx
    restart: unless-stopped
    networks:
      - sp-net
    ports:
      - "${CGV_NGINX_PORT:-18080}:80"
    volumes:
      - ./deploy/nginx/cgv-shinyproxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ${SP_CACHE_DIR:?set-SP_CACHE_DIR-to-an-absolute-host-path}:/srv/cgv-cache:ro
    depends_on:
      - shinyproxy

  report-cleaner:
    image: "${CGV_IMAGE:-cgv:1.1.0}"
    restart: unless-stopped
    command: ["sh", "-c", "while true; do Rscript /app/scripts/cleanup_shared_reports.R; sleep 900; done"]
    environment:
      CGV_CACHE_DIR: "/app/cache"
    volumes:
      - ${SP_CACHE_DIR:?set-SP_CACHE_DIR-to-an-absolute-host-path}:/app/cache
    networks:
      - sp-net
    healthcheck:
      disable: true

  background-report-worker:
    image: "${CGV_IMAGE:-cgv:1.1.0}"
    container_name: cgv-background-report-worker
    restart: unless-stopped
    init: true
    command: ["Rscript", "/app/scripts/background_report_worker.R"]
    env_file:
      - .env
      - path: .env.local
        required: false
    environment:
      APP_DIR: "/app"
      CGV_DATA_ROOT: "/app"
      CGV_CACHE_DIR: "/app/cache"
      CGV_PUBLIC_BASE_URL: "${CGV_PUBLIC_BASE_URL:-https://cgev.mobilomics.org}"
      APP_SHARED_REPORTS_ENABLED: "1"
      APP_BACKGROUND_REPORTS_ENABLED: "${APP_BACKGROUND_REPORTS_ENABLED:-1}"
      APP_BACKGROUND_REPORT_POLL_SECONDS: "${APP_BACKGROUND_REPORT_POLL_SECONDS:-3}"
      APP_BACKGROUND_REPORT_TIMEOUT_MINUTES: "${APP_BACKGROUND_REPORT_TIMEOUT_MINUTES:-30}"
      APP_BACKGROUND_REPORT_FUTURE_WORKERS: "${APP_BACKGROUND_REPORT_FUTURE_WORKERS:-2}"
      APP_BACKGROUND_REPORT_LASTZ_WORKERS: "${APP_BACKGROUND_REPORT_LASTZ_WORKERS:-1}"
      APP_LASTZ_GLOBAL_WORKERS: "${APP_LASTZ_GLOBAL_WORKERS:-1}"
      APP_LASTZ_GLOBAL_QUEUE_WAIT_SECONDS: "${APP_LASTZ_GLOBAL_QUEUE_WAIT_SECONDS:-1800}"
      CHROMOTE_CHROME: "/usr/bin/google-chrome"
    volumes:
      - ${SP_ANNOTATIONS_DIR:?set-SP_ANNOTATIONS_DIR-to-an-absolute-host-path}:/app/annotations:ro
      - ${SP_GENOMES_DIR:?set-SP_GENOMES_DIR-to-an-absolute-host-path}:/app/genomes:ro
      - ${SP_GO_ANNOTATIONS_DIR:?set-SP_GO_ANNOTATIONS_DIR-to-an-absolute-host-path}:/app/go_annotations:ro
      - ${SP_DATA_DIR:?set-SP_DATA_DIR-to-an-absolute-host-path}:/app/data:ro
      - ${SP_CACHE_DIR:?set-SP_CACHE_DIR-to-an-absolute-host-path}:/app/cache
      - ${SP_NCBI_DOWNLOADS_DIR:?set-SP_NCBI_DOWNLOADS_DIR-to-an-absolute-host-path}:/app/ncbi_downloads
    networks:
      - sp-net
    shm_size: "256mb"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "test -s /app/cache/background_reports/worker.ready"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

networks:
  sp-net:
    name: sp-net
    driver: bridge
