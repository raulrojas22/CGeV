proxy:
  title: CGeV - Comparative Gene Viewer
  landing-page: /app_direct/cgv
  heartbeat-rate: ${SP_HEARTBEAT_RATE_MS:30000}
  heartbeat-timeout: 120000
  container-wait-time: 180000
  port: 8080
  authentication: none
  container-backend: docker
  container-strategy: spawn
  stop-proxy-on-startup-failure: true
  hide-navbar: true
  max-total-instances: ${SP_MAX_TOTAL_INSTANCES:10}
  default-proxy-max-lifetime: ${SP_MAX_LIFETIME_MINUTES:120}

  docker:
    internal-networking: true

  specs:
    - id: cgv
      display-name: CGeV - Comparative Gene Viewer
      description: Interactive Shiny app for ortholog analysis, GO enrichment, and genome comparison
      container-image: ${CGV_IMAGE:cgv:1.0.0}
      container-cmd: ["bash", "/app/deploy/docker/run-app.sh"]
      container-network: sp-net
      container-env-file: /opt/shinyproxy/env/cgv.env
      container-env:
        APP_PREWARM_ON_START: "0"
        APP_PREWARM_BLOCK_START: "0"
        APP_SESSION_METRICS: "1"
        APP_PERF_TIMING: "${SP_APP_PERF_TIMING:0}"
        APP_PERF_LOG_DIR: "/app/cache/perf_runs"
        APP_PERF_RUN_LABEL: "${SP_PERF_RUN_LABEL:manual}"
        APP_ORTHO_SUSPEND_HIDDEN: "${SP_ORTHO_SUSPEND_HIDDEN:1}"
        APP_GENE_CATALOG_ENABLED: "${SP_GENE_CATALOG_ENABLED:0}"
        APP_HOMO_DEFER_SEQUENCE: "${SP_HOMO_DEFER_SEQUENCE:0}"
        APP_ORTHO_DEFER_SEQUENCE: "${SP_ORTHO_DEFER_SEQUENCE:0}"
        APP_FOOTER_DEFER_SEQUENCE: "${SP_FOOTER_DEFER_SEQUENCE:0}"
        APP_DEFER_FEATURE_GC: "${SP_DEFER_FEATURE_GC:0}"
        APP_HOMO_RENDER_CHUNK_SIZE: "${SP_HOMO_RENDER_CHUNK_SIZE:1}"
        APP_HOMO_AUTO_RENDER_DELAY_MS: "${SP_HOMO_AUTO_RENDER_DELAY_MS:120}"
        APP_ORTHO_RENDER_CHUNK_SIZE: "${SP_ORTHO_RENDER_CHUNK_SIZE:1}"
        APP_ORTHO_AUTO_RENDER_MORE: "${SP_ORTHO_AUTO_RENDER_MORE:1}"
        APP_ORTHO_AUTO_RENDER_DELAY_MS: "${SP_ORTHO_AUTO_RENDER_DELAY_MS:120}"
        APP_HOMO_INITIAL_VISIBLE: "${SP_HOMO_INITIAL_VISIBLE:1}"
        APP_ORTHO_INITIAL_VISIBLE: "${SP_ORTHO_INITIAL_VISIBLE:1}"
        APP_ISOFORM_RENDER_BATCH_SIZE: "${SP_ISOFORM_RENDER_BATCH_SIZE:1}"
        APP_ISOFORM_RENDER_BATCH_DELAY_MS: "${SP_ISOFORM_RENDER_BATCH_DELAY_MS:120}"
        APP_ORTHO_SERVER_RENDER_NUDGE: "${SP_ORTHO_SERVER_RENDER_NUDGE:0}"
        APP_BUILD_REVISION: "${CGV_IMAGE:cgv:1.0.0}"
        APP_BACKGROUND_REPORTS_ENABLED: "${SP_BACKGROUND_REPORTS_ENABLED:1}"
        APP_LASTZ_GLOBAL_WORKERS: "${SP_LASTZ_GLOBAL_WORKERS:1}"
        APP_LASTZ_GLOBAL_QUEUE_WAIT_SECONDS: "${SP_LASTZ_GLOBAL_QUEUE_WAIT_SECONDS:1800}"
        FEEDBACK_RESEND_API_KEY: "${FEEDBACK_RESEND_API_KEY:}"
        FEEDBACK_TO_EMAIL: "${FEEDBACK_TO_EMAIL:cgvviewer@gmail.com}"
        FEEDBACK_FROM_EMAIL: "${FEEDBACK_FROM_EMAIL:CGeV Feedback <feedback@cgvapp.com>}"
        REPORT_RESEND_API_KEY: "${REPORT_RESEND_API_KEY:}"
        REPORT_FROM_EMAIL: "${REPORT_FROM_EMAIL:CGeV Reports <reports@cgvapp.com>}"
        REPORT_REPLY_TO_EMAIL: "${REPORT_REPLY_TO_EMAIL:cgvviewer@gmail.com}"
        CGV_DATA_ROOT: "/app"
        CGV_CACHE_DIR: "/app/cache"
        CGV_NCBI_DOWNLOADS_DIR: "/app/ncbi_downloads"
        CGV_NCBI_CACHE_MAX_GB: "${CGV_NCBI_CACHE_MAX_GB:50}"
        CGV_NCBI_USAGE_LOG_ENABLED: "${CGV_NCBI_USAGE_LOG_ENABLED:true}"
        APP_ALIAS_DISK_CACHE_DIR: "/app/cache/external_alias"
      container-volumes:
        - "${SP_ANNOTATIONS_DIR}:/app/annotations:ro"
        - "${SP_GENOMES_DIR}:/app/genomes:ro"
        - "${SP_GO_ANNOTATIONS_DIR}:/app/go_annotations:ro"
        - "${SP_DATA_DIR}:/app/data:ro"
        - "${SP_CACHE_DIR}:/app/cache"
        - "${SP_NCBI_DOWNLOADS_DIR}:/app/ncbi_downloads"
      container-memory-limit: ${SP_CONTAINER_MEMORY:2g}
      container-cpu-shares: 1024
      minimum-seats-available: ${SP_MINIMUM_SEATS_AVAILABLE:1}
      allow-container-re-use: ${SP_ALLOW_CONTAINER_RE_USE:false}
      scale-down-delay: ${SP_SCALE_DOWN_DELAY_MINUTES:10}
      max-instances: ${SP_MAX_INSTANCES_PER_USER:10}
      max-total-instances: ${SP_MAX_TOTAL_INSTANCES:10}
      max-lifetime: ${SP_MAX_LIFETIME_MINUTES:120}

logging:
  file:
    /var/log/shinyproxy/shinyproxy.log
