name: CGeV Desktop Linux x64

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cgv-desktop-linux-x64
  cancel-in-progress: false

jobs:
  linux-x64:
    name: Runtime, AppImage, DEB, and package validation
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Resolve desktop version
        id: release
        working-directory: desktop
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up micromamba and conda-pack
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
        with:
          environment-name: cgv-build
          create-args: conda-pack
          init-shell: bash
          cache-downloads: true

      - name: Install Electron dependencies
        working-directory: desktop
        run: npm ci

      - name: Run Node tests and package guardrails
        working-directory: desktop
        run: |
          npm test
          npm run verify:config

      - name: Build Linux scientific runtime
        shell: micromamba-shell {0}
        working-directory: desktop
        run: npm run runtime:linux:x64

      - name: Build AppImage and DEB
        working-directory: desktop
        run: npm run build:linux:x64

      - name: Validate Linux packages
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          appimages=(desktop/dist/*-Linux-x86_64.AppImage)
          debs=(desktop/dist/*-Linux-amd64.deb)
          if [[ ${#appimages[@]} -ne 1 ]]; then
            echo "Expected exactly one Linux x86_64 AppImage; found ${#appimages[@]}." >&2
            exit 1
          fi
          if [[ ${#debs[@]} -ne 1 ]]; then
            echo "Expected exactly one Linux amd64 DEB; found ${#debs[@]}." >&2
            exit 1
          fi

          appimage="${appimages[0]}"
          deb="${debs[0]}"
          chmod +x "$appimage"
          file "$appimage" "$deb"
          dpkg-deb --info "$deb"

          validation_root="$RUNNER_TEMP/cgv-linux-package-validation"
          mkdir -p "$validation_root/appimage" "$validation_root/deb"
          (
            cd "$validation_root/appimage"
            "$GITHUB_WORKSPACE/$appimage" --appimage-extract >/dev/null
          )
          dpkg-deb --extract "$deb" "$validation_root/deb"

          appimage_figure_studio="$validation_root/appimage/squashfs-root/resources/app/www/js/figure_studio.js"
          deb_figure_studio="$(find "$validation_root/deb" -path '*/resources/app/www/js/figure_studio.js' -type f -print -quit)"
          appimage_runtime="$validation_root/appimage/squashfs-root/resources/runtime/linux-x64/bin/Rscript"
          deb_runtime="$(find "$validation_root/deb" -path '*/resources/runtime/linux-x64/bin/Rscript' -type f -print -quit)"
          test -s "$appimage_figure_studio"
          test -n "$deb_figure_studio"
          test -s "$deb_figure_studio"
          test -x "$appimage_runtime"
          test -n "$deb_runtime"
          test -x "$deb_runtime"
          cmp www/js/figure_studio.js "$appimage_figure_studio"
          cmp www/js/figure_studio.js "$deb_figure_studio"

          sha256sum "$appimage" "$deb" > desktop/dist/SHA256SUMS-linux-x64.txt
          cat desktop/dist/SHA256SUMS-linux-x64.txt

      - name: Upload Linux installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: CGeV-Desktop-Linux-x64-${{ steps.release.outputs.version }}
          if-no-files-found: error
          retention-days: 14
          path: |
            desktop/dist/CGeV-Desktop-${{ steps.release.outputs.version }}-Linux-x86_64.AppImage
            desktop/dist/CGeV-Desktop-${{ steps.release.outputs.version }}-Linux-amd64.deb
            desktop/dist/latest-linux.yml
            desktop/dist/SHA256SUMS-linux-x64.txt
